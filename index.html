<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="UNGR ARCHIVE / アングラアーカイブ — 脳の中の議論をする場。ムー君の冒険。" />
  <title>UNGR ARCHIVE</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=20260729app2" />
</head>
<body>
  <div class="viewport">
    <div id="app-shell" class="phone" data-tab="home">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time" id="status-time">12:00</span>
        <span class="status-brand">UNGR</span>
        <span class="status-dots">●●●</span>
      </div>

      <main class="screen" id="screen">
        <!-- HOME -->
        <section class="page is-on" data-page="home" aria-label="ホーム">
          <header class="home-head">
            <img class="home-avatar" src="assets/ungr-avatar.jpg" alt="" />
            <div>
              <p class="home-kicker">アングラアーカイブ</p>
              <h1 class="home-title">UNGR ARCHIVE</h1>
            </div>
          </header>

          <p class="home-tag">脳の中の議論をする場</p>

          <a
            id="mou-launch"
            class="mou-launch"
            href="game.html"
            aria-label="ムー君の冒険をはじめる"
          >
            <img class="mou-art" src="assets/title.png" alt="ムー君の冒険" />
            <span class="mou-veil"></span>
            <span class="mou-cta">
              <span class="mou-cta-label">TAP TO ENTER</span>
              <span class="mou-cta-title">ムー君の冒険</span>
            </span>
            <span class="mou-pulse" aria-hidden="true"></span>
          </a>

          <section class="block">
            <div class="block-head">
              <h2>新着</h2>
              <button type="button" class="text-btn" data-go="feed">すべて</button>
            </div>
            <div id="home-feed" class="home-feed"></div>
          </section>

          <section class="block">
            <div class="block-head"><h2>お知らせ</h2></div>
            <div id="notice-list" class="notice-list"></div>
          </section>
        </section>

        <!-- FEED -->
        <section class="page" data-page="feed" aria-label="アーカイブ" hidden>
          <header class="page-head">
            <h2>ARCHIVE</h2>
            <p>議論とカルチャーの保管庫</p>
          </header>
          <div class="chips" id="chips">
            <button type="button" class="chip is-on" data-filter="all">すべて</button>
            <button type="button" class="chip" data-filter="essay">批評</button>
            <button type="button" class="chip" data-filter="film">映画</button>
            <button type="button" class="chip" data-filter="music">音楽</button>
            <button type="button" class="chip" data-filter="anime">アニメ</button>
            <button type="button" class="chip" data-filter="book">本</button>
            <button type="button" class="chip" data-filter="game">ゲーム</button>
            <button type="button" class="chip" data-filter="about">紹介</button>
          </div>
          <div id="media-list" class="media-list"></div>
        </section>

        <!-- ABOUT -->
        <section class="page" data-page="about" aria-label="情報" hidden>
          <header class="about-top">
            <img src="assets/ungr-avatar.jpg" alt="UNGR ARCHIVE" />
            <div>
              <h2>UNGR ARCHIVE</h2>
              <p>@ungr.archive</p>
            </div>
          </header>
          <p id="about-statement" class="about-copy"></p>
          <ul id="role-list" class="pill-row"></ul>
          <ul id="keyword-list" class="pill-row accent"></ul>
          <div id="stat-grid" class="stats"></div>
          <div id="link-grid" class="socials"></div>
          <a id="mail-link" class="mail" href="mailto:ungr.archive@gmail.com">ungr.archive@gmail.com</a>
          <a id="portfolio-link" class="ghost-btn" href="#" target="_blank" rel="noopener">ポートフォリオ</a>
        </section>
      </main>

      <nav class="dock" aria-label="メニュー">
        <button type="button" class="dock-btn is-on" data-go="home">
          <span class="dock-ico">⌂</span>
          <span>ホーム</span>
        </button>
        <button type="button" class="dock-btn" data-go="feed">
          <span class="dock-ico">▣</span>
          <span>動画</span>
        </button>
        <a class="dock-btn dock-play" href="game.html" id="dock-play">
          <span class="dock-ico">▶</span>
          <span>冒険</span>
        </a>
        <button type="button" class="dock-btn" data-go="about">
          <span class="dock-ico">◎</span>
          <span>情報</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="boot-fade" class="boot-fade" hidden></div>

  <dialog id="player-dialog" class="player-dialog">
    <form method="dialog" class="player-bar">
      <p id="player-title"></p>
      <button value="close" type="submit">閉じる</button>
    </form>
    <div class="player-frame">
      <iframe id="player-frame" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <a id="player-open" href="#" target="_blank" rel="noopener">YouTubeで開く</a>
  </dialog>

  <script type="module" src="js/app.js?v=20260729app2"></script>
</body>
</html>
